<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
  <div class="container">

    <h1>CRUD de tareas</h1>

    <!-- FORMULARIO -->
    <form id="task-form">

      <input
        type="text"
        id="task-input"
        placeholder="Escribe una tarea"
      >

      <button type="submit">
        Guardar
      </button>

    </form>

    <!-- MENSAJE -->
    <p id="message"></p>

    <!-- LISTA -->
    <ul id="task-list"></ul>

  </div>

  <script src="app.js"></script>

</body>
</html>
